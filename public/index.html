<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATCH NEXT</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="wrap nav"><a class="logo" href="#">MATCH<span>NEXT</span></a><nav><a href="#available">空いているチーム</a><a href="#tournaments">大会</a><a href="#teams">チーム</a><a class="navbtn" href="#register">チーム登録</a></nav></div></header>
<section class="hero"><div class="wrap heroGrid"><div><p class="eyebrow">SPORTS PRACTICE MATCH PLATFORM</p><h1>大会で空いた日を、<span>次の試合へ。</span></h1><p>大会期間中に敗退して空いた日程から、練習試合の相手を探せるチーム向けサービス。</p><a class="btn primary" href="#available">空いているチームを探す</a></div><div class="heroCard"><b>大会</b> → <b>敗退</b> → <b>空き日</b> → <b>練習試合</b><p>勝ち進む予定で確保していた日程を、次の試合につなげる。</p></div></div></section>
<section class="section" id="available"><div class="wrap"><div class="head"><div><p class="eyebrow">AVAILABLE DATES</p><h2>今、空いているチーム</h2></div><span id="availableCount"></span></div><div class="filters"><input id="dateFilter" type="date"><select id="typeFilter"><option value="">区分すべて</option><option>小学校</option><option>中学校</option><option>高校</option><option>大学</option><option>クラブチーム</option></select><input id="areaFilter" placeholder="市区町村"><input id="sportFilter" placeholder="競技"></div><div id="availableList" class="grid"></div></div></section>
<section class="section alt" id="tournaments"><div class="wrap"><p class="eyebrow">TOURNAMENTS</p><h2>大会から探す</h2><div id="tournamentList" class="grid2"></div></div></section>
<section class="section" id="teams"><div class="wrap"><p class="eyebrow">TEAMS</p><h2>登録チーム</h2><input id="teamSearch" placeholder="チーム名・市区町村・競技で検索"><div id="teamList" class="grid"></div></div></section>
<section class="section alt" id="register"><div class="wrap formWrap"><p class="eyebrow">REGISTER</p><h2>チームを登録する</h2><form id="teamForm" class="form"><div class="formGrid">
<label>チーム名 *<input name="name" required></label><label>チーム区分 *<select name="type" required><option value="">選択</option><option>小学校</option><option>中学校</option><option>高校</option><option>大学</option><option>クラブチーム</option></select></label>
<label>競技 *<input name="sport" placeholder="サッカー" required></label><label>カテゴリー<input name="category" placeholder="U-15 / Aチーム"></label><label>都道府県 *<input name="prefecture" placeholder="愛知県" required></label><label>市区町村 *<input name="city" placeholder="豊田市" required></label>
<label>Instagram URL<input name="instagram"></label><label>学校・チーム電話番号 *<input name="schoolPhone" required></label><label>顧問・代表者電話番号<input name="coachPhone"></label><label class="check"><input type="checkbox" name="showCoachPhone"> 顧問・代表者の電話番号を公開する</label></div>
<label>チーム紹介<textarea name="intro" rows="4"></textarea></label><button class="btn primary">登録する</button><p id="formMsg"></p></form></div></section>
<footer><div class="wrap">MATCH NEXT — 大会で空いた日を、次の試合へ。</div></footer><script src="/app.js"></script></body></html>
